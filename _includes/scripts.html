{%- assign lang = page.lang | default: 'en' -%}
{%- assign t = site.data.ui[lang] -%}
<script>
  window.SITE_I18N = {
    copy: {{ t.copy | jsonify }},
    copied: {{ t.copied | jsonify }},
    diagram: {{ t.diagram | jsonify }},
    onThisPage: {{ t.on_this_page | jsonify }}
  };
</script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
  window.addEventListener('site:mermaid-ready', (e) => mermaid.run({ nodes: e.detail }));
</script>
